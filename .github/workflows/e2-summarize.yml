name: e2-summarize (champion loop aggregation)

# 汇总 E2（gens8, run 35348152028）与 E2b（gens16, run 35348158629）冠军生产循环的逐轮结果。
# 在 Actions 内下载两个大 artifact（506MB + 300MB），解析每轮 ga_generations.csv 的最优 fitness，
# 产出小型 CSV/MD 汇总——替代人工下载 800MB。
# 逐轮口径：ga_generations.csv 的 fitness 列取 max = 末代最优 = 最终精评（日志已对上：gen7=61107 ↔ 精评 61106.9）。
# 若 round 目录未记录 uma id，则做全体分布对比（两 run 马池与轮换结构相同，期望意义等价）；
# probe 步骤先打印真实 schema，若解析错位可据此修正 v2。
# 触发器：push 到本分支（写入本文件的提交自身即触发一次）+ 手动 dispatch（带占位输入，
# 与 region-scan 的已验证 on: 写法一致——空 workflow_dispatch: 在本仓曾导致 dispatch 404）。
# 注意：run 块内所有行保持块缩进，严禁列 0 内容（会截断 YAML block scalar，region-scan 首版踩过）。

on:
  push:
    branches:
      - workbench/e2-summarize
  workflow_dispatch:
    inputs:
      note:
        description: 'unused placeholder'
        default: ''

concurrency:
  group: e2-summarize
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download E2 artifact (gens8, 506MB)
        uses: actions/download-artifact@v4
        with:
          name: ga-e2_gens8
          run-id: 35348152028
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: e2

      - name: Download E2b artifact (gens16, 300MB)
        uses: actions/download-artifact@v4
        with:
          name: ga-e2b_gens16
          run-id: 35348158629
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: e2b

      - name: Probe schema（先看结构再聚合）
        run: |
          echo "== 目录结构采样 =="
          find e2 -maxdepth 3 -type d | head -8
          echo "== 采样 ga_generations.csv =="
          SAMPLE_CSV=$(find e2 -name ga_generations.csv | head -1)
          echo "sample: $SAMPLE_CSV"
          head -5 "$SAMPLE_CSV"
          echo "== 采样 best_genome.toml 头部 =="
          SAMPLE_TOML=$(find e2 -name best_genome.toml | head -1)
          head -8 "$SAMPLE_TOML"
          echo "== round 目录内是否记录 uma =="
          grep -ril "uma" "$(dirname "$SAMPLE_CSV")" | head -5 || echo "(round 目录内无 uma 记录)"

      - name: Aggregate per-round champion fitness
        run: |
          python3 - <<'PYEOF'
          import csv, glob, os, statistics as st

          def rounds(root):
              out = {}
              for d in glob.glob(os.path.join(root, "**", "run_*"), recursive=True):
                  tag = os.path.basename(d)
                  if not tag.startswith("run_"):
                      continue
                  p = os.path.join(d, "ga_generations.csv")
                  if not os.path.exists(p):
                      continue
                  try:
                      with open(p, newline="", encoding="utf-8") as fh:
                          rows = list(csv.DictReader(fh))
                  except Exception as e:
                      print(f"[{tag}] csv 读取失败: {e}")
                      continue
                  if not rows:
                      continue
                  fcols = [k for k in rows[0] if "fit" in k.lower()]
                  vals = None
                  if fcols:
                      c = fcols[0]
                      try:
                          vals = [float(r[c]) for r in rows if r.get(c) not in (None, "", "None")]
                      except ValueError:
                          vals = None
                  if vals is None:
                      nums = []
                      for r in rows:
                          for v in r.values():
                              try:
                                  nums.append(float(v))
                              except (TypeError, ValueError):
                                  pass
                      vals = nums or []
                  if not vals:
                      continue
                  out[int(tag.split("_")[1])] = max(vals)
              return out

          def describe(name, d):
              vs = [d[k] for k in sorted(d)]
              if not vs:
                  return f"- {name}: 无数据"
              q = sorted(vs)

              def pct(p):
                  return q[min(len(q) - 1, int(len(q) * p))]

              return (f"- {name}: n={len(vs)} | mean={st.mean(vs):.1f} | median={st.median(vs):.1f} | "
                      f"p75={pct(0.75):.1f} | p90={pct(0.90):.1f} | p99={pct(0.99):.1f} | max={max(vs):.1f}")

          e2 = rounds("e2")
          e2b = rounds("e2b")

          L = ["# E2 vs E2b 冠军循环逐轮汇总", "",
               describe("E2  (gens8,  run 35348152028)", e2),
               describe("E2b (gens16, run 35348158629)", e2b), ""]
          if e2 and e2b:
              m2, mb = st.median(e2.values()), st.median(e2b.values())
              L.append(f"- 逐轮最优中位差（E2b − E2）= {mb - m2:+.1f}")
              if mb - m2 > 0:
                  L.append("- 与窗口判读一致：gens16 逐轮冠军质量更高")
              else:
                  L.append("- 与窗口判读相反，需进一步看分布")
          L += ["", "明细见 e2_summary.csv（列: arm, round, best_fitness）"]

          with open("e2_summary.csv", "w", newline="", encoding="utf-8") as fh:
              w = csv.writer(fh)
              w.writerow(["arm", "round", "best_fitness"])
              for arm, d in (("gens8", e2), ("gens16", e2b)):
                  for k in sorted(d):
                      w.writerow([arm, k, round(d[k], 1)])

          with open("e2_summary.md", "w", encoding="utf-8") as fh:
              fh.write("\n".join(L))
          print("\n".join(L))
          PYEOF

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2-summary
          path: |
            e2_summary.csv
            e2_summary.md
          retention-days: 90
